      - heading "Glossary" [level=2] [ref=f32e578]
      - paragraph [ref=f32e579]: Business terms used above.
      - generic [ref=f32e580]:
        - heading "The gate" [level=3] [ref=f32e581]
        - generic [ref=f32e585]:
          - term [ref=f32e586]: Two-factor OTP
          - definition [ref=f32e587]: Two separate OTPs, each tied to its own attribute context, must both pass. One OTP is never enough.
          - term [ref=f32e588]: Sequential verification
          - definition [ref=f32e589]: OTP1 is checked first; only if it passes is OTP2 checked. A failed OTP1 means OTP2 is never evaluated.
          - term [ref=f32e590]: Attribute context
          - definition [ref=f32e591]:
            - text: Each OTP is bound to a specific field.
            - code [ref=f32e592]: OTP1_ATTR
            - text: /
            - code [ref=f32e593]: OTP2_ATTR
            - text: are
            - code [ref=f32e594]: "\"value$$attribute_id\""
            - text: strings; the id maps to EMAIL (109), EMAIL_ALT (157), PH_MOBILE (121) or PH_MOBILE_ALT (48).
          - term [ref=f32e595]: Value-match check
          - definition [ref=f32e596]: For OTP2, the correct code is not enough — the value it was generated for must also equal the new value being submitted, or the request is rejected.
          - term [ref=f32e597]: Verification-only
          - definition [ref=f32e598]: This feature writes no profile data. It confirms identity and then delegates the real change.
