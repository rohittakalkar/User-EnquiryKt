    - paragraph [ref=f32e30]: Knowledge Transfer · Engineering
    - heading "Update With OTP" [level=1] [ref=f32e31]
    - paragraph [ref=f32e32]:
      - text: Update With OTP is a backend security gate, not a screen. When a supplier changes a sensitive contact detail (mobile, email) — or overrides a locked / verified field such as a Tactical-Verified GST — this feature requires
      - strong [ref=f32e33]: two
      - text: "separate OTPs, each tied to an attribute context, verified strictly in sequence. It writes no profile data itself: once both OTPs pass, it strips the OTP fields and calls the standard"
      - code [ref=f32e34]: /user/update
      - text: API to perform the actual change. All the real write logic, and its downstream validations, live there.
