  - main [ref=f30e29]:
    - paragraph [ref=f30e30]: Knowledge Transfer · Engineering
    - heading "PNS Setting" [level=1] [ref=f30e31]
    - paragraph [ref=f30e32]:
      - text: PNS Setting stores a supplier's off-hours call-routing preferences — which of their mobiles, landlines or additional-contact numbers should still receive calls outside business hours (
      - code [ref=f30e33]: IIL_PNS_SETTING
      - text: ). One
      - code [ref=f30e34]: POST /pnssetting
      - text: endpoint inserts, updates or deletes a mapping per number-type. The contact number is always re-derived server-side from the profile, never trusted from the request. A separate consumer auto-re-syncs these preferences whenever the supplier changes a phone number in the general profile-edit flow, and that path — unlike the direct API — enforces a five-mapping cap.
