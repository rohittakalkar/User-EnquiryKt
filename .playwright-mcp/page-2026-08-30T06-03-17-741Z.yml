      - paragraph [ref=f30e589]:
        - text: "Source:"
        - code [ref=f30e590]: PNS Setting KT
        - text: business & technical docs. The max-five-mappings cap is disabled in the write API and only enforced in the auto-sync consumer, so a direct GLADMIN caller can exceed it. Only delete writes history; the exact meaning of
        - code [ref=f30e591]: offhrs_flag
        - text: 1 vs 2 vs 3 is an open question, and the contact-deletion cascade into
        - code [ref=f30e592]: IIL_PNS_SETTING
        - text: is queued, not transactional — all flagged in the source doc.
    - generic [ref=f30e593]:
      - heading "Glossary" [level=2] [ref=f30e594]
      - paragraph [ref=f30e595]: Business terms used above.
      - generic [ref=f30e596]:
        - heading "The preference" [level=3] [ref=f30e597]
        - generic [ref=f30e601]:
          - term [ref=f30e602]: Off-hours routing
          - definition [ref=f30e603]: Whether a given number keeps ringing outside business hours. That is the only thing this feature decides.
          - term [ref=f30e604]:
            - code [ref=f30e605]: IIL_PNS_SETTING
          - definition [ref=f30e606]: The table holding one row per (supplier, number-type, contact) mapping.
          - term [ref=f30e607]:
            - code [ref=f30e608]: offhrs_flag
          - definition [ref=f30e609]: 1 / 2 / 3 mean insert-or-update (all three are “set” values); 0 means delete. Reads treat 2 and 3 as “off-hours active”.
          - term [ref=f30e610]: Re-derived contact number
          - definition [ref=f30e611]: The actual phone number is always read back from the profile tables server-side; the number in the request is never trusted. A non-numeric result is stored as “INVALID”.
          - term [ref=f30e612]: GSM must exist
          - definition [ref=f30e613]: The supplier must already have a virtual GSM number, or the request is rejected with “GSM Number does not exist”.
      - generic [ref=f30e614]:
        - heading "Number types" [level=3] [ref=f30e615]
        - generic [ref=f30e619]:
          - term [ref=f30e620]:
            - code [ref=f30e621]: M1
            - text: /
            - code [ref=f30e622]: M2
          - definition [ref=f30e623]: Primary and alternate mobile — general types, no contact id needed.
          - term [ref=f30e624]:
            - code [ref=f30e625]: L1
            - text: /
            - code [ref=f30e626]: L2
          - definition [ref=f30e627]: Primary and secondary landline — general types, no contact id needed.
          - term [ref=f30e628]:
            - code [ref=f30e629]: M
            - text: /
            - code [ref=f30e630]: L
            - text: /
            - code [ref=f30e631]: T
          - definition [ref=f30e632]: Additional-contact mobile / landline / tollfree — each needs a contact id.
          - term [ref=f30e633]:
            - code [ref=f30e634]: D
            - text: sentinel
          - definition [ref=f30e635]:
            - text: Not a real type; with
            - code [ref=f30e636]: action_flag="d"
            - text: it deletes every mapping row for a (supplier, contact) pair at once.
          - term [ref=f30e637]: Duplicate-number resolution
          - definition [ref=f30e638]:
            - text: A number can map to only one type; if it turns up under two, the row with the higher (or equal)
            - code [ref=f30e639]: offhrs_flag
            - text: survives and the other is silently deleted.
      - generic [ref=f30e640]:
        - heading "Automatic sync & reads" [level=3] [ref=f30e641]
        - generic [ref=f30e647]:
          - term [ref=f30e648]: Auto-resync (Flow C)
          - definition [ref=f30e649]:
            - text: When a supplier changes a mobile / landline / GSM in the ordinary profile-edit flow, a
            - code [ref=f30e650]: USER_UPSERT_ADDITIONAL
            - text: consumer re-calls
            - code [ref=f30e651]: /pnssetting
            - text: over HTTP so the preferences follow the new number.
          - term [ref=f30e652]: Five-mapping cap
          - definition [ref=f30e653]: A limit of five active mappings per supplier — enforced only on the auto-resync path, not on direct API calls.
          - term [ref=f30e654]: Delete-cascade
          - definition [ref=f30e655]:
            - text: Removing an additional contact elsewhere queues a delete of its
            - code [ref=f30e656]: IIL_PNS_SETTING
            - text: rows; there is a brief window where the contact is gone but its mapping is not.
          - term [ref=f30e657]: Bulk read
          - definition [ref=f30e658]: Up to ten comma-separated GLIDs; the response says which of them have an off-hours flag of 2 or 3.
          - term [ref=f30e659]: GLID
          - definition [ref=f30e660]: GlobalID — the unique internal identifier for the supplier.
