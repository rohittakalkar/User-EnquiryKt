    - generic [ref=f31e704]:
      - heading "Glossary" [level=2] [ref=f31e705]
      - paragraph [ref=f31e706]: Business terms used above.
      - generic [ref=f31e707]:
        - heading "Integration record" [level=3] [ref=f31e708]
        - generic [ref=f31e712]:
          - term [ref=f31e713]: WhatsApp Business integration
          - definition [ref=f31e714]: A supplier's official WhatsApp Business account linked to IndiaMART through an external BSP vendor — an ongoing, status-tracked relationship, not a one-time setup.
          - term [ref=f31e715]: BSP
          - definition [ref=f31e716]: Business Solution Provider — the external WhatsApp-messaging vendor (AiSensy / Meta / ValueFirst) the integration runs on.
          - term [ref=f31e717]: Admin / LMS only
          - definition [ref=f31e718]: The integration record is written only by internal GLADMIN or LMS tools; the supplier never calls this API directly.
          - term [ref=f31e719]: Sub-status buckets
          - definition [ref=f31e720]: Numeric statuses group into ACTIVE (11–14), PARTIALLY_ACTIVE (15), INACTIVE (16–19) and others. Moving into the active bucket (12–14) or out of it (15–19) is what triggers a log row.
          - term [ref=f31e721]:
            - text: First-time
            - code [ref=f31e722]: LIVE
            - text: does not log
          - definition [ref=f31e723]: Status 11 (first activation) is deliberately excluded from the status-change log; only transitions through reinstated / locked / deleted states are recorded.
          - term [ref=f31e724]: Scam / Spam flag
          - definition [ref=f31e725]: A Meta-side flag recorded as its own independent audit row (internal code 3 = SCAM, 4 = SPAM), separate from status-change logging.
          - term [ref=f31e726]: One-hot response
          - definition [ref=f31e727]: The read API returns every possible enum key with a 1 / 0 value rather than a single string; clients scan for the key set to 1.
      - generic [ref=f31e728]:
        - heading "Outbound nudge" [level=3] [ref=f31e729]
        - generic [ref=f31e733]:
          - term [ref=f31e734]: App-install nudge
          - definition [ref=f31e735]: A transactional WhatsApp (or SMS) message asking a user to install the IndiaMART app.
          - term [ref=f31e736]: Shared dispatch point
          - definition [ref=f31e737]:
            - text: The generic
            - code [ref=f31e738]: sendmsg
            - text: endpoint sends both SMS and WhatsApp; the channel is chosen purely by the caller's
            - code [ref=f31e739]: source
            - text: value. Only
            - code [ref=f31e740]: WHATSAPP_8181
            - text: and
            - code [ref=f31e741]: WHATSAPP_9696
            - text: route to WhatsApp.
          - term [ref=f31e742]: 24-hour frequency cap
          - definition [ref=f31e743]: Per mobile number, the same nudge is not re-sent within 24 hours. Only successful past attempts count, so a failed attempt can be retried sooner.
          - term [ref=f31e744]:
            - code [ref=f31e745]: iil_whatsapp_msg_events
          - definition [ref=f31e746]:
            - text: The send-history table the cap is checked against — in a different physical database (
            - code [ref=f31e747]: notification_pg_master
            - text: ) from the integration record.
          - term [ref=f31e748]: Already-installed skip
          - definition [ref=f31e749]: If the system already knows the user is on an app-installed device, the nudge is skipped entirely.
          - term [ref=f31e750]: Template vs free-text
          - definition [ref=f31e751]:
            - code [ref=f31e752]: WHATSAPP_9696
            - text: sends a pre-approved content template; other WhatsApp sources send a hardcoded free-text message.
