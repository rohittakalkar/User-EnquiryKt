        - generic [ref=f29e651]:
          - term [ref=f29e652]:
            - code [ref=f29e653]: ACTION
            - text: 1 — add
          - definition [ref=f29e654]: Insert a fresh number into the pool as available.
          - term [ref=f29e655]:
            - code [ref=f29e656]: ACTION
            - text: 2 — re-flag
          - definition [ref=f29e657]: Change an existing number's availability flag without moving it.
          - term [ref=f29e658]:
            - code [ref=f29e659]: ACTION
            - text: 3 — assign
          - definition [ref=f29e660]: Give a supplier a specific number, or auto-allocate a random available one. A swap via the user-update API happens if the chosen row was already held.
          - term [ref=f29e661]:
            - code [ref=f29e662]: ACTION
            - text: 4 — release
