    - paragraph [ref=f29e29]: Knowledge Transfer · Engineering
    - heading "PNS — Virtual Number Pool" [level=1] [ref=f29e30]
    - paragraph [ref=f29e31]:
      - text: PNS manages a shared pool of virtual GSM (“IM_GSM”) numbers that mask a supplier's real phone. One write endpoint drives the whole lifecycle through a single numeric
      - code [ref=f29e32]: ACTION
      - text: "code: add a number to the pool, re-flag one, allocate one to a supplier, release one back, or bulk-convert many. Allocation and release both call the standard user-update API to actually attach or clear the number on the supplier. The replication queue is commented out, so the auth / search copies of the pool drift; a separate deletion-reason queue is live and feeds an audit table."
