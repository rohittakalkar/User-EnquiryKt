        - generic [ref=f29e631]:
          - term [ref=f29e632]: PNS
          - definition [ref=f29e633]: Privacy Number Service — a pool of virtual GSM numbers that sit in front of a supplier's real phone so buyers never see the real number.
          - term [ref=f29e634]: IM_GSM
          - definition [ref=f29e635]:
            - text: The virtual number attached to a supplier (
            - code [ref=f29e636]: glusr_usr_im_gsm
            - text: ). Allocating sets it; releasing clears it.
          - term [ref=f29e637]:
            - code [ref=f29e638]: GL_GSM_MASTER
          - definition [ref=f29e639]: The master pool table — one row per virtual number, with an availability flag and a vendor type.
          - term [ref=f29e640]:
            - code [ref=f29e641]: FLAG_IS_AVAILABLE
          - definition [ref=f29e642]:
            - text: 2 = available, 1 = assigned, 0 / -1 = two “reclaimable” buckets. Which reclaimable bucket is used is chosen by
            - code [ref=f29e643]: PNS_TYPE
            - text: .
          - term [ref=f29e644]: Vendor type
          - definition [ref=f29e645]: The telecom vendor a number belongs to; auto-allocation only picks a random row matching the supplier's vendor type.
